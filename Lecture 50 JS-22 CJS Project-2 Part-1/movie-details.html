<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie details</title>
</head>
<body>
    <h1>Movie details</h1>

    <div id="movie-detail">
       
        <div>
            <img src="${data.poster}" alt="">
        </div>

        <div>
            <h2>${data.title}</h2>

            <section>
                <p>${data.Released}</p>
                <p>>${data.Rate}</p>
                <p>>${data.Runtime}</p>
                <p>>${data.genre}</p>
                <p>>${data.Released}</p>
            </section>

            <section></section>
        </div>
    </div>


    <script src="movie-details.js"></script>
</body>
</html>

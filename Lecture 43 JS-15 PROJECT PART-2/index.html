<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale-1.0">
        <title>Document</title>
         <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
    </head>
    <body class="bg-slate-100 min-h-screen py-10 px-4">

        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-300">

              <h1 class="bg-indigo-600  px-6 py-5 text-2xl font-bold tracking-wide text-cyan-50 ">Todo App</h1> 
       <div class="flex p-5 ">
         <form class="flex flex-col mb-6">
         <div class="flex gap-5 mb-1">

             <input class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800" type="text"  placeholder="Enter task description...">

                      <button class="bg-indigo-700 text-2xl  hover:bg-indigo-900 text-cyan-50 w-15 px-15 py-2 flex items-center justify-center shadow-[inset_0_1px_0_#ffffff59,inset_0_-2px_0_#0003,0_1px_2px_#0006,0_8px_24px_-6px_#5b5bf099] rounded-lg mx-15 my-2 cursor-pointer" id="adBtn">Add</button>

         </div>
         <div>
             <button class="bg-indigo-700 text-2xl  hover:bg-indigo-900 text-cyan-50 w-15 px-15 py-2 flex items-center justify-center shadow-[inset_0_1px_0_#ffffff59,inset_0_-2px_0_#0003,0_1px_2px_#0006,0_8px_24px_-6px_#5b5bf099] rounded-lg mx-15 my-2 cursor-pointer" id="adBtn-2">Cancel Editing</button>
         </div>
         </form>
      
       
          <div>
              <h2 class="">Task(0)</h2>
              <h2 class="">COMPLETED: 0</h2>
          </div>
      
       </div>
       
       </div>       
      
        </div>
      
    </body>
    <script src="index.js"></script>
</html>
